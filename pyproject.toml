[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "job-hunting-machine"
version = "0.1.0"
description = "Local-first job-search database foundation (Architecture v2, Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.15,<1",
]

[project.scripts]
jhm = "job_hunting_machine.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunting_machine"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/config", "/docs", "/AGENTS.md", "/README.md",
    "/pyproject.toml", "/uv.lock", "/alembic.ini", "/.gitignore", "/.env.example", "/.python-version",
]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".uv-cache", ".pytest-tmp*", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
